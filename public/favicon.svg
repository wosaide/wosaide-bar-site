<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="10 7 188 188"
  width="1024"
  height="1024"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">Geometric bird</title>
  <desc id="description">
    A geometric black bird, redrawn as separately addressable vector parts for animation.
  </desc>

  <style>
    #bird {
      fill: #242424;
    }

    #eye {
      fill: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      #bird {
        fill: #ffffff;
      }

      #eye {
        fill: #242424;
      }
    }

    .anim-part {
      transform-box: fill-box;
      transform-origin: center;
    }
  </style>

  <!-- Change this value once to recolor the whole bird. -->
  <g id="bird">
    <g id="head-and-neck" class="anim-part" data-part="head-and-neck">
      <path d="
        M 119.7,45.1
        L 88.2,57.2
        L 88.2,68.8
        L 150.2,108.6
        L 90.4,108.6
        C 80.5,108.6 72.6,101.4 72.6,92.3
        L 57.0,92.3
        C 57.0,108.4 69.6,122.0 85.8,123.4
        L 80.2,147.3
        C 47.9,143.8 25.5,119.0 25.5,87.5
        L 25.5,51.2
        C 25.5,30.5 46.4,16.2 65.2,23.6
        Z
      "/>
    </g>

    <g id="body" class="anim-part" data-part="body">
      <path d="
        M 78.8,123.5
        L 175.0,123.5
        L 182.3,163.2
        L 166.7,163.2
        L 160.4,147.5
        L 78.8,147.5
        Z
      "/>
    </g>

    <g id="front-leg" class="anim-part" data-part="front-leg">
      <path d="M 104.1,145.8 L 119.4,145.8 L 119.4,179.6 L 104.1,179.6 Z"/>
    </g>

    <g id="back-leg" class="anim-part" data-part="back-leg">
      <path d="M 73.7,142.0 L 88.2,147.4 L 75.8,178.9 L 60.6,173.6 Z"/>
    </g>

    <g id="eye" class="anim-part" data-part="eye">
      <circle cx="56.5" cy="52.8" r="7.8"/>
    </g>
  </g>
</svg>
