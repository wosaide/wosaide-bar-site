<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="10 7 188 188"
  width="1024"
  height="1024"
  role="img"
  aria-labelledby="title description"
>
  <title id="title">WOS Aide bird — single-line animation</title>
  <desc id="description">
    One continuous line traces the complete outer silhouette of the bird before
    the shape fills with ink and settles into a quiet living motion.
  </desc>

  <style>
    :root {
      --bird-ink: #242424;
      --paper: #ffffff;
    }

    .bird {
      transform-box: fill-box;
      transform-origin: center;
      animation: living 5s 2.45s ease-in-out infinite;
    }

    .silhouette {
      fill: var(--bird-ink);
      opacity: 0;
      animation: fill-in .12s 1.9s ease-out forwards;
    }

    .outline {
      fill: none;
      stroke: var(--bird-ink);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
      animation: draw 1.9s cubic-bezier(.58, 0, .22, 1) forwards,
                 outline-away .4s 2.05s ease-out forwards;
    }

    .eye {
      fill: var(--paper);
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: eye-in .24s 2.18s ease-out forwards,
                 blink 5s 2.45s ease-in-out infinite;
    }

    @keyframes draw {
      from { stroke-dashoffset: 1; }
      to { stroke-dashoffset: 0; }
    }

    @keyframes fill-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes outline-away {
      to { opacity: 0; }
    }

    @keyframes eye-in {
      from { opacity: 0; transform: scale(.15); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes living {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      28% { transform: translateY(-1px) rotate(-.22deg) scale(1.003, 1.009); }
      56% { transform: translateY(.3px) rotate(.12deg) scale(1); }
      78% { transform: translateY(-.45px) rotate(-.06deg) scale(1.002, 1.005); }
    }

    @keyframes blink {
      0%, 42%, 46%, 73%, 77%, 100% { transform: scaleY(1); }
      44%, 75% { transform: scaleY(.08); }
    }

    @media (prefers-reduced-motion: reduce) {
      .bird, .silhouette, .outline, .eye { animation: none; }
      .silhouette, .eye { opacity: 1; }
      .outline { display: none; }
    }
  </style>

  <defs>
    <path
      id="bird-outline"
      pathLength="1"
      d="
        M 119.7,45.1
        L 88.2,57.2
        L 88.2,68.8
        L 150.2,108.6
        L 90.4,108.6
        C 80.5,108.6 72.6,101.4 72.6,92.3
        L 57,92.3
        C 57,108.4 69.6,122 85.8,123.4
        L 175,123.5
        L 182.3,163.2
        L 166.7,163.2
        L 160.4,147.5
        L 119.4,147.5
        L 119.4,179.6
        L 104.1,179.6
        L 104.1,147.5
        L 88.2,147.5
        L 75.8,178.9
        L 60.6,173.6
        L 70.8,147.5
        C 47.9,143.8 25.5,119 25.5,87.5
        L 25.5,51.2
        C 25.5,30.5 46.4,16.2 65.2,23.6
        Z
      "
    />
  </defs>

  <g class="bird">
    <use class="silhouette" href="#bird-outline"/>
    <use class="outline" href="#bird-outline" aria-hidden="true"/>
    <circle class="eye" cx="56.5" cy="52.8" r="7.8"/>
  </g>
</svg>
