server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /bar {
        return 308 /bar/;
    }

    location /bar/ {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Versioned installers and release artifacts. Files live in /srv/wosaide/download.
    location = /download {
        return 308 /download/;
    }

    location /download/ {
        autoindex off;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Update feeds/manifests. Keep these fresh so clients do not hold stale metadata.
    location = /update {
        return 308 /update/;
    }

    location /update/ {
        autoindex off;
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Reserved API surface. Replace with proxy_pass when the WOS Aide API is deployed.
    location = /api {
        return 308 /api/;
    }

    location /api/ {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "60" always;
        return 503 '{"error":"api_not_configured"}\n';
    }

    location / {
        return 404;
    }
}
