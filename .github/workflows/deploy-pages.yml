name: Validate public website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the single production /bar site
        run: npm run build:pages
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_SITE_ORIGIN: https://wosaide.com
          NEXT_PUBLIC_BASE_PATH: /bar
